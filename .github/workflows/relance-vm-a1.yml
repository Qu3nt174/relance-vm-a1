# =====================================================================
#  Relance automatique de la création de la VM Oracle Cloud A1 (ARM)
#  à partir du boot volume existant, jusqu'à ce que de la capacité
#  se libère à Paris.
#
#  Fonctionnement :
#  - Un run tourne en boucle ~5 h 30 (un essai toutes les 90 s),
#    puis se relance lui-même (workflow_dispatch) : la chaîne ne
#    dépend pas du planificateur GitHub, souvent en retard.
#  - Un cron horaire sert seulement de filet de sécurité si la
#    chaîne venait à se casser.
#  - Succès : ouvre une issue (e-mail) puis désactive le workflow.
#  - Boot volume déjà attaché (VM créée ailleurs) : désactive.
#  - Erreur définitive (auth, limites, paramètre) : issue + désactive.
#
#  Secrets requis (Settings > Secrets and variables > Actions) :
#    OCI_USER, OCI_TENANCY, OCI_FINGERPRINT, OCI_KEY,
#    OCI_BOOT_VOLUME_ID, OCI_SUBNET_ID
# =====================================================================

name: Relance VM A1

on:
  workflow_dispatch: {}      # lancement manuel ET auto-relance
  schedule:
    - cron: "17 * * * *"     # filet de sécurité, une fois par heure

# Droits du jeton GitHub : relancer/désactiver le workflow, créer une issue
permissions:
  actions: write
  issues: write
  contents: read

# Un seul run à la fois ; un run supplémentaire attend son tour
concurrency:
  group: relance-vm-a1
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 350     # limite GitHub : 360 min par job
    env:
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
      REGION: "eu-paris-1"
      AD: "LbLd:EU-PARIS-1-AD-1"
      OCPUS: "2"
      MEMORY_GB: "12"
      DISPLAY_NAME: "vm-principale"
      WORKFLOW_FILE: "relance-vm-a1.yml"
      LOOP_MINUTES: "330"    # durée de la boucle avant auto-relance
      INTERVAL: "90"         # secondes entre deux essais
      BACKOFF_429: "300"     # pause si Oracle signale trop de requêtes

    steps:
      - name: Installer OCI CLI
        run: pip install --quiet --disable-pip-version-check oci-cli

      - name: Écrire la configuration OCI
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: |
          mkdir -p ~/.oci
          # Clé privée API (contenu complet du fichier .pem)
          printf '%s\n' "$OCI_KEY" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          # Fichier de configuration standard de la CLI
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_USER}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY}
          region=${REGION}
          key_file=${HOME}/.oci/key.pem
          EOF
          sed -i 's/^[[:space:]]*//' ~/.oci/config
          chmod 600 ~/.oci/config

      - name: Boucle de tentatives
        id: launch
        env:
          TENANCY: ${{ secrets.OCI_TENANCY }}
          BOOT_VOLUME_ID: ${{ secrets.OCI_BOOT_VOLUME_ID }}
          SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
        run: |
          set +e

          # Paramètres JSON passés par fichier (évite les soucis de guillemets)
          printf '{"ocpus": %s, "memoryInGBs": %s}' "$OCPUS" "$MEMORY_GB" > shape.json
          printf '{"sourceType": "bootVolume", "bootVolumeId": "%s"}' "$BOOT_VOLUME_ID" > source.json

          deadline=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          attempt=0
          result="timeout"

          while [ "$(date +%s)" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            now=$(date -u +%H:%M:%S)

            # 1) La VM existe-t-elle déjà ? (boot volume attaché ou en cours)
            attached=$(oci compute boot-volume-attachment list \
              --compartment-id "$TENANCY" \
              --availability-domain "$AD" \
              --boot-volume-id "$BOOT_VOLUME_ID" \
              --query "length(data[?\"lifecycle-state\"=='ATTACHED' || \"lifecycle-state\"=='ATTACHING'])" \
              --raw-output 2>/dev/null)
            if [ -n "$attached" ] && [ "$attached" != "0" ]; then
              echo "[$now] Le boot volume est déjà attaché : la VM existe."
              result="already"
              break
            fi

            # 2) Une tentative, sans les réessais internes de la CLI
            out=$(oci compute instance launch \
              --compartment-id "$TENANCY" \
              --availability-domain "$AD" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config file://shape.json \
              --source-details file://source.json \
              --subnet-id "$SUBNET_ID" \
              --assign-public-ip false \
              --display-name "$DISPLAY_NAME" \
              --no-retry 2>&1)
            code=$?

            if [ $code -eq 0 ]; then
              instance_id=$(printf '%s' "$out" | sed -n 's/.*"id": "\(ocid1\.instance[^"]*\)".*/\1/p' | head -n 1)
              echo "[$now] Essai $attempt : SUCCÈS, instance $instance_id"
              echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"
              result="success"
              break
            fi

            summary=$(printf '%s' "$out" | grep -E '"(code|message)"' | head -n 2 | tr -s ' ' | tr '\n' ' ')

            if printf '%s' "$out" | grep -qiE 'out of (host )?capacity'; then
              echo "[$now] Essai $attempt : pas de capacité."
              sleep "$INTERVAL"
              continue
            fi

            if printf '%s' "$out" | grep -qiE 'TooManyRequests'; then
              echo "[$now] Essai $attempt : trop de requêtes, pause ${BACKOFF_429}s."
              sleep "$BACKOFF_429"
              continue
            fi

            if printf '%s' "$out" | grep -qiE 'NotAuthenticated|NotAuthorizedOrNotFound|LimitExceeded|InvalidParameter|CannotParseRequest'; then
              echo "[$now] Essai $attempt : erreur définitive : $summary"
              {
                echo "summary<<EOS"
                echo "$summary"
                echo "EOS"
              } >> "$GITHUB_OUTPUT"
              result="fatal"
              break
            fi

            # Erreur inconnue (souvent passagère) : on continue après une pause
            echo "[$now] Essai $attempt : erreur inattendue : $summary"
            sleep "$INTERVAL"
          done

          echo "Fin de boucle : résultat = $result après $attempt essai(s)."
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Prévenir (succès)
        if: steps.launch.outputs.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          INSTANCE_ID: ${{ steps.launch.outputs.instance_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "✅ VM A1 créée" \
            --body "La VM a été créée (2 OCPU / 12 Go) : \`$INSTANCE_ID\`.

          Étape suivante : console OCI > instance > VNIC > IPv4 Addresses > ⋯ > Edit > Reserved public IP."

      - name: Prévenir (erreur définitive)
        if: steps.launch.outputs.result == 'fatal'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.launch.outputs.summary }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "❌ Relance VM A1 arrêtée" \
            --body "Oracle a renvoyé une erreur définitive, le workflow est désactivé.

          \`$SUMMARY\`"

      - name: Désactiver le workflow
        if: steps.launch.outputs.result == 'success' || steps.launch.outputs.result == 'already' || steps.launch.outputs.result == 'fatal'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "$WORKFLOW_FILE" --repo "$GITHUB_REPOSITORY"

      - name: Se relancer (pas encore de capacité)
        if: steps.launch.outputs.result == 'timeout'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "$WORKFLOW_FILE" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
